<div class="container mx-auto max-w-4xl">
    <!-- Transaction Header -->
    <div class="mb-8">
        <h2 class="text-2xl font-bold mb-2">Create Dex Order</h2>
        <p class="text-text-secondary">Trade your assets for other Counterparty assets on the DEX</p>
    </div>
    
    <!-- Transaction Form -->
    <div class="glass-card rounded-xl p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            
            <div>
                <label class="block text-text-secondary text-sm mb-2">Give Asset Name (what you're trading away)</label>
                <div class="flex space-x-2">
                    <span id="order-selected-asset"></span>
                </div>
                
            </div>

            <div>
                <label class="block text-text-secondary text-sm mb-2">Get Asset Name (what you're getting')</label>
                <input id="order-asset-get-asset" type="text" placeholder="GETASSETNAME" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>
            
            <div>
                <label class="block text-text-secondary text-sm mb-2">Give Quantity</label>
                <input id="order-asset-give-quantity" type="number" placeholder="0" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>

            <div>
                <label class="block text-text-secondary text-sm mb-2">Get Quantity</label>
                <input id="order-asset-get-quantity" type="number" placeholder="0" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>

            <div>
                <label class="block text-text-secondary text-sm mb-2">Expiration (in blocks) <br>2016~=30 days<br>8064~=120 days (max)</label>
                <input id="order-expiration" type="number" value="2016" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>
            
            <div>

            </div>
        </div>
        
        <div id="order-fee-selector"></div>
        
        <!-- Action Buttons -->
        <div class="flex gap-4 pt-4 border-t border-border-color justify-end">
            <button id="order-submit-tx-btn" class="btn-primary px-6 py-3 rounded-lg flex">
                <i class="fas fa-paper-plane mr-2"></i> Submit Transaction
            </button>
        </div>
    </div>
</div>
