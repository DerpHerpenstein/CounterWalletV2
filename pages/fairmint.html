<div class="container mx-auto max-w-4xl">
    <!-- Page Header -->
    <div class="mb-6">
        <h2 class="text-3xl font-bold text-text-primary">Mint Fairminter</h2>
        <p class="text-text-secondary mt-1">Mint open fairminters on Counterparty</p>
    </div>

    <!-- Loading State -->
    <div id="fairmint-loading" class="hidden flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-accent-blue border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-text-secondary">Loading fairmints...</p>
    </div>

    <!-- Empty State -->
    <div id="fairmint-empty" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 bg-card-bg rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-fire text-4xl text-text-secondary"></i>
        </div>
        <h3 class="text-xl font-semibold text-text-primary mb-2">No Fairminters Found</h3>
        <p class="text-text-secondary max-w-xs">We couldn't find any open fairminters. Try again later.</p>
    </div>

    <!-- Error State -->
    <div id="fairmint-error" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 bg-red-500/10 rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
        </div>
        <h3 class="text-xl font-semibold text-text-primary mb-2">Failed to Load Fairmints</h3>
        <p class="text-text-secondary max-w-xs mb-6" id="fairmint-error-message">An error occurred while loading fairmints.</p>
        <button id="fairmint-retry-btn"
                class="btn-primary px-6 py-3 rounded-2xl flex items-center gap-2 hover:scale-105 transition-all">
            <i class="fas fa-redo"></i>
            <span>Retry</span>
        </button>
    </div>

    <!-- Fairminter Grid -->
    <div id="fairmint-fairminter-data" class="py-3 grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-6">
    </div>

    <div class="text-center text-xs text-text-secondary mt-8">
        Images powered by <a href="https://cdn.xcp.io" target="_blank" class="hover:text-accent-blue">cdn.xcp.io</a>
    </div>
</div>
