<div class="container mx-auto max-w-6xl">
    <!-- Page Header -->
    <div class="mb-6 flex justify-between items-end">
        <div>
            <h2 class="text-3xl font-bold text-text-primary">Explore</h2>
            <p class="text-text-secondary mt-1">Browse the latest asset issuances on Counterparty</p>
        </div>
        <div id="explore-stats" class="text-right text-sm text-text-secondary hidden">
            <span id="explore-count" class="font-mono"></span> issuances
        </div>
    </div>

    <!-- Asset Search -->
    <div class="mb-8">
        <div class="flex gap-2">
            <input id="explore-search-input" type="text" placeholder="Search for an asset (e.g. PEPE)" 
                   class="input-field flex-1 px-4 py-3 rounded-2xl focus:outline-none">
            <button id="explore-search-btn" 
                    class="btn-primary px-6 py-3 rounded-2xl flex items-center justify-center hover:scale-105 transition-all"
                    title="Find Asset">
                <i class="fas fa-search text-lg"></i>
            </button>
        </div>
        <p class="text-xs text-text-secondary mt-1.5 ml-1">Find asset by name</p>
    </div>

    <!-- Loading State -->
    <div id="explore-loading" class="hidden flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-accent-blue border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-text-secondary">Loading latest issuances...</p>
    </div>

    <!-- Empty State -->
    <div id="explore-empty" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 bg-card-bg rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-compass text-4xl text-text-secondary"></i>
        </div>
        <h3 class="text-xl font-semibold text-text-primary mb-2">No Issuances Found</h3>
        <p class="text-text-secondary max-w-xs">We couldn't find any recent issuances. Try again later.</p>
    </div>

    <!-- Error State -->
    <div id="explore-error" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 bg-red-500/10 rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
        </div>
        <h3 class="text-xl font-semibold text-text-primary mb-2">Failed to Load Issuances</h3>
        <p class="text-text-secondary max-w-xs mb-6" id="explore-error-message">An error occurred while loading issuances.</p>
        <button id="explore-retry-btn"
                class="btn-primary px-6 py-3 rounded-2xl flex items-center gap-2 hover:scale-105 transition-all">
            <i class="fas fa-redo"></i>
            <span>Retry</span>
        </button>
    </div>

    <!-- Issuance Grid -->
    <div id="explore-asset-data" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    </div>

    <!-- Load More -->
    <div id="explore-load-more-container" class="flex justify-center mt-10 hidden">
        <button id="explore-load-more-btn" 
                class="btn-primary px-8 py-3 rounded-2xl flex items-center gap-3 hover:scale-105 transition-all">
            <span>Load More Issuances</span>
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>

    <div class="text-center text-xs text-text-secondary mt-8">
        Images powered by <a href="https://cdn.xcp.io" target="_blank" class="hover:text-accent-blue">cdn.xcp.io</a>
    </div>
</div>
