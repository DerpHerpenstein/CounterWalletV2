<div class="container mx-auto max-w-4xl">
    <!-- Loading State -->
    <div id="asset-loading" class="hidden flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-accent-blue border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-text-secondary">Loading asset details...</p>
    </div>

    <!-- Error / Not Found State -->
    <div id="asset-error" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 bg-card-bg rounded-2xl flex items-center justify-center mb-6">
            <i class="fas fa-exclamation-triangle text-4xl text-error"></i>
        </div>
        <h3 class="text-xl font-semibold text-text-primary mb-2">Asset Not Found</h3>
        <p id="asset-error-message" class="text-text-secondary max-w-xs">We couldn't find that asset on the Counterparty network.</p>
    </div>

    <!-- Asset Detail -->
    <div id="asset-detail" class="hidden">
        <div class="glass-card rounded-3xl overflow-hidden border border-border-color">
            <!-- Image Container -->
            <div class="relative h-64 bg-card-bg overflow-hidden">
                <img id="asset-image" 
                     class="w-full h-full object-contain bg-[#1e2937] p-6"
                     alt="Asset Image">
                
                <!-- Badges -->
                <div class="absolute top-4 left-4 flex flex-col gap-1.5" id="asset-badges">
                    <!-- Populated by JS -->
                </div>

                <!-- Quantity / Supply Badge -->
                <div id="asset-quantity-badge"
                     class="absolute top-4 right-4 bg-black/70 text-white text-xs font-mono px-3 py-1 rounded-2xl backdrop-blur-md border border-white/20 hidden">
                </div>

                <!-- Gradient overlay -->
                <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-black/70 to-transparent"></div>
            </div>

            <!-- Content -->
            <div class="p-6">
                <div class="flex items-start justify-between gap-4 mb-4">
                    <h1 id="asset-name" class="text-3xl font-bold text-text-primary tracking-tight break-all"></h1>
                </div>

                <div id="asset-description" 
                     class="text-text-secondary text-sm leading-relaxed mb-6 min-h-[3rem]">
                </div>

                <!-- Metadata Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="bg-card-bg/50 rounded-2xl p-4 border border-border-color">
                        <div class="text-xs text-text-secondary mb-1">Supply</div>
                        <div id="asset-supply" class="font-mono text-lg text-text-primary"></div>
                    </div>
                    <div class="bg-card-bg/50 rounded-2xl p-4 border border-border-color">
                        <div class="text-xs text-text-secondary mb-1">Divisibility</div>
                        <div id="asset-divisible" class="text-lg text-text-primary"></div>
                    </div>
                    <div class="bg-card-bg/50 rounded-2xl p-4 border border-border-color">
                        <div class="text-xs text-text-secondary mb-1">Locked</div>
                        <div id="asset-locked" class="text-lg text-text-primary"></div>
                    </div>
                    <div class="bg-card-bg/50 rounded-2xl p-4 border border-border-color">
                        <div class="text-xs text-text-secondary mb-1">Issuer</div>
                        <div id="asset-issuer" class="font-mono text-sm text-text-primary break-all"></div>
                    </div>
                    <div class="bg-card-bg/50 rounded-2xl p-4 border border-border-color sm:col-span-2">
                        <div class="text-xs text-text-secondary mb-1">Asset ID</div>
                        <div id="asset-id" class="font-mono text-sm text-text-primary break-all"></div>
                    </div>
                </div>

                <!-- Quick Actions (shown when wallet connected) -->
                <div id="asset-quick-actions" class="hidden mt-6 pt-6 border-t border-border-color">
                    <div class="text-sm text-text-secondary mb-3">Quick Actions</div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <button data-action="send" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-paper-plane"></i>
                            <span>Send</span>
                        </button>
                        <button data-action="dispenser" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-store"></i>
                            <span>Open Dispenser</span>
                        </button>
                        <button data-action="order" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-chart-line"></i>
                            <span>DEX Order</span>
                        </button>
                        <button data-action="destroy" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-fire"></i>
                            <span>Destroy</span>
                        </button>
                        <button data-action="airdrop" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-parachute-box"></i>
                            <span>Airdrop</span>
                        </button>
                        <button data-action="dividend" class="asset-action-btn btn-primary px-2 py-2 rounded-xl flex flex-col items-center gap-1 text-sm">
                            <i class="fas fa-gift"></i>
                            <span>Dividend</span>
                        </button>
                    </div>
                </div>

                <!-- External Links -->
                <div class="flex flex-wrap gap-3 pt-4 border-t border-border-color">
                    <a id="asset-explorer-link" href="#" target="_blank"
                       class="btn-secondary px-5 py-2.5 rounded-2xl flex items-center gap-2 text-sm hover:bg-white/5 transition-colors">
                        <i class="fas fa-external-link-alt text-xs"></i>
                        <span>View on Horizon Market</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="text-center text-xs text-text-secondary mt-6">
            Images powered by <a href="https://cdn.xcp.io" target="_blank" class="hover:text-accent-blue">cdn.xcp.io</a>
        </div>
    </div>
</div>
