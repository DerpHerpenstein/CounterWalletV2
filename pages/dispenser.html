<div class="container mx-auto max-w-4xl">
    <!-- Transaction Header -->
    <div class="mb-8">
        <h2 class="text-2xl font-bold mb-2">Create Dispenser</h2>
        <p class="text-text-secondary">Sell your assets for BTC</p>
    </div>
    
    <!-- Transaction Form -->
    <div class="glass-card rounded-xl p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            
            <div>
                <label class="block text-text-secondary text-sm mb-2">Asset Name</label>
                <div class="flex space-x-2">
                    <span id="dispenser-selected-asset"></span>
                </div>
                
            </div>
            
            <div>
                <label class="block text-text-secondary text-sm mb-2">Give Quantity (usually 1)</label>
                <input id="dispenser-asset-give-quantity" type="number" placeholder="0" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>

            <div>
                <label class="block text-text-secondary text-sm mb-2">Escrow Quantity (total to sell)</label>
                <input id="dispenser-asset-escrow-quantity" type="number" placeholder="0" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>

            <div>
                <label class="block text-text-secondary text-sm mb-2">Price (in btc)</label>
                <input id="dispenser-asset-price-btc" type="number" placeholder="0" 
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>
            
            <div>

            </div>
        </div>
        
        <div id="dispenser-fee-selector"></div>
        
        <!-- Action Buttons -->
        <div class="flex gap-4 pt-4 border-t border-border-color justify-end">
            <button id="dispenser-submit-tx-btn" class="btn-primary px-6 py-3 rounded-lg flex">
                <i class="fas fa-paper-plane mr-2"></i> Submit Transaction
            </button>
        </div>
    </div>
</div>
